# =============================================================================
# Decaid Android 11 适配版 —— 自动构建与发布
# =============================================================================
#
# 仓库: https://github.com/UncleIce/decaid-android11
#
# 【触发条件】
#   1. push tag  v*          ← 与上游 tag 格式一致
#   2. 手动 workflow_dispatch
#
# 【设计要点】
#   · Flutter 版本锁定 3.47.9 —— 项目要求 Dart ^3.13.0，
#     3.50 会强制 Gradle 9.3.1+ 而项目锁定 8.14.3，编译失败
#   · 签名密钥从 Secrets 注入，且编译后核验指纹，
#     防止 CI 用错密钥导致用户无法覆盖升级
#   · 产物命名为 decaid-android11-<版本>-arm64.apk，
#     与官方 decaid-android-*.apk 区分
# =============================================================================

name: Android 11 Build & Release

on:
  push:
    tags:
      # 只响应本仓库的 tag。fork 会继承上游全部 v* tag（当前 78 个稳定版），
      # 若写成 'v*' 会把上游 tag 也当作构建目标。
      - 'android11-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '用于产物的版本标签（如 v0.9.3，会自动加 android11- 前缀）'
        required: true
        default: 'v0.9.3-dryrun'

# 避免同一 tag 重复构建
concurrency:
  group: android11-${{ github.ref }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Flutter 版本必须与上游一致，否则 Gradle 兼容性出问题
  FLUTTER_VERSION: '3.47.9'
  # 期望的签名指纹：与现有安装保持一致，否则用户无法覆盖升级
  EXPECTED_SIGNATURE: ${{ vars.EXPECTED_SIGNATURE }}

jobs:
  # ===========================================================================
  # 阶段 1：预检 —— 补丁能否应用
  # ===========================================================================
  # 单独成 job 的好处：补丁失效时快速失败，不浪费 15 分钟编译时间
  # ===========================================================================
  precheck:
    name: 预检补丁
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # 显式指定分支：workflow 文件定义在默认分支 main 上（GitHub 要求），
          # 但补丁代码和脚本在 android11 分支。不指定的话手动触发会检出 main，
          # 那里没有 patch-android11.sh，预检必然失败。
          # tag 触发时会自动使用被推的 tag，这里的 ref 只影响 workflow_dispatch。
          ref: ${{ github.event_name == 'workflow_dispatch' && 'android11' || github.ref }}

      - name: 解析版本号
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.tag }}"
          else
            REF="${GITHUB_REF#refs/tags/}"
          fi

          # tag 形如 android11-v0.9.2，取后面的 v0.9.2 作为版本标签
          # 手动触发时允许只填 v0.9.3，统一补上前缀
          case "$REF" in
            android11-*) TAG="$REF" ;;
            *)           TAG="android11-$REF" ;;
          esac

          # 版本号必须是纯 semver（App 内用 pub_semver 比较）
          VERSION="${TAG#android11-}"
          VERSION="${VERSION#v}"

          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号不合法: '$VERSION'（来自 tag '$REF'）"
            echo "::error::期望形如 android11-v0.9.2 或 v0.9.2"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "标签: $TAG"
          echo "版本: $VERSION"

      - name: 应用补丁（DRY RUN）
        run: |
          chmod +x patch-android11.sh
          DRY_RUN=1 ./patch-android11.sh .

  # ===========================================================================
  # 阶段 2：编译
  # ===========================================================================
  build:
    name: 编译 APK
    needs: precheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'android11' || github.ref }}
          fetch-depth: 0      # flutter_with_commit.sh 需要 git tag 历史

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4
        with:
          # build-tools 必须装：apksigner 在这里面，用于校验产物签名。
          # 只装 platform-tools 的话，后面的签名校验会因为找不到
          # apksigner 而拿到空值，看起来像「签名不符」。
          packages: 'platform-tools build-tools;36.0.0'

      # -----------------------------------------------------------------------
      # 签名密钥 —— 必须是你自己的密钥
      # -----------------------------------------------------------------------
      # 上游用的是基于 f4ae824f 的密钥，用它编译出的包与您平板上的
      # 953a1ad5 签名不同，会导致 INSTALL_FAILED_UPDATE_INCOMPATIBLE
      # -----------------------------------------------------------------------
      - name: 注入签名密钥
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_B64，无法签名"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/debug.keystore
          echo "密钥大小: $(stat -c%s android/app/debug.keystore) 字节"

      - name: 核验密钥指纹
        run: |
          ACTUAL=$(keytool -list -v -keystore android/app/debug.keystore \
                     -storepass android -alias androiddebugkey 2>/dev/null \
                   | grep -i 'SHA256:' | head -1 \
                   | sed 's/.*SHA256: *//' | tr -d ': ' | tr 'A-Z' 'a-z')
          echo "密钥指纹: $ACTUAL"
          if [ -n "$EXPECTED_SIGNATURE" ] && [ "$ACTUAL" != "$EXPECTED_SIGNATURE" ]; then
            echo "::error::密钥指纹不符！期望 $EXPECTED_SIGNATURE"
            exit 1
          fi

      - name: 应用补丁
        run: |
          chmod +x patch-android11.sh
          ./patch-android11.sh .

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 拉取依赖
        run: flutter pub get

      # -----------------------------------------------------------------------
      # 外部插件 —— 上游 CI 也会执行，缺失会导致 APK 里没有这几个插件
      # -----------------------------------------------------------------------
      - name: 拉取外部插件
        continue-on-error: true      # 插件拉取失败不阻断构建
        run: |
          for s in fetch_dye2_plugin.sh fetch_shot_upload_plugin.sh fetch_dcamp_plugin.sh; do
            if [ -x "scripts/$s" ]; then
              echo "::group::$s"
              ./scripts/$s || echo "::warning::$s 执行失败，继续"
              echo "::endgroup::"
            else
              echo "::warning::scripts/$s 不存在，跳过"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 编译
      # -----------------------------------------------------------------------
      # 用上游的 flutter_with_commit.sh 而非直接 flutter build，因为它会：
      #   · 从 git tag 推导 VERSION 并 --dart-define 注入
      #   · 注入 COMMIT / BUILD_TIME 等元信息
      # 不注入的话 BuildInfo.version 会是 pubspec 默认的 1.0.0
      #
      # 但它内部是 VERSION="${TAG#v}"，遇到 android11-v0.9.2 会得到
      # "android11-v0.9.2" 这个非法版本号（App 用 pub_semver 比较会崩）。
      # 所以先补一个纯 semver 的本地 tag（v0.9.2）指向当前提交，
      # 让 git describe 取到它，不改动上游脚本。
      # -----------------------------------------------------------------------
      - name: 编译 APK
        run: |
          VERSION="${{ needs.precheck.outputs.version }}"
          LOCAL_TAG="v${VERSION}"

          git tag -f "$LOCAL_TAG" HEAD >/dev/null
          echo "已创建本地辅助 tag: $LOCAL_TAG → $(git rev-parse --short HEAD)"
          echo "git describe: $(git describe --tags --abbrev=0)"

          if [ -x ./flutter_with_commit.sh ]; then
            ./flutter_with_commit.sh build apk --release --target-platform android-arm64
          else
            echo "::warning::flutter_with_commit.sh 不存在，降级为直接编译"
            flutter build apk --release --target-platform android-arm64 \
              --dart-define=VERSION="$VERSION"
          fi
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}

      # -----------------------------------------------------------------------
      # 产物校验
      # -----------------------------------------------------------------------
      - name: 校验编译产物
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK" || { echo "::error::编译产物不存在"; exit 1; }

          echo "大小: $(du -h "$APK" | cut -f1)"

          echo "--- 验证补丁已生效 ---"
          if unzip -p "$APK" lib/arm64-v8a/libapp.so 2>/dev/null \
               | strings | grep -q "degraded mode DISABLED"; then
            echo "✓ 补丁已编入产物"
          else
            echo "::error::产物中找不到补丁标记，构建可能未生效"
            exit 1
          fi

          echo "--- 验证 APK 签名 ---"

          # 这个 APK 只使用 v2 签名方案，没有 META-INF/*.RSA，
          # 因此 keytool 无法作为兜底 —— 必须真的找到 apksigner。
          APKSIGNER=""
          if command -v apksigner >/dev/null 2>&1; then
            APKSIGNER="apksigner"
          else
            APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" \
                          -path '*build-tools*/apksigner' -type f 2>/dev/null \
                        | sort -V | tail -1)
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner，无法校验签名"
            echo "::error::检查 build 步骤是否安装了 build-tools"
            echo "::error::ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<空>}"
            ls "${ANDROID_SDK_ROOT:-/nonexistent}/build-tools" 2>/dev/null || echo "  (无 build-tools 目录)"
            exit 1
          fi

          echo "使用: $APKSIGNER"
          verify_out=$("$APKSIGNER" verify -v --print-certs "$APK" 2>&1) || {
            echo "$verify_out"
            echo "::error::apksigner verify 失败"
            exit 1
          }

          echo "$verify_out" | grep -iE 'Verified using|Number of signers' || true

          SIG=$(printf '%s\n' "$verify_out" \
                | grep -i 'SHA-256 digest' | head -1 \
                | sed 's/.*: *//' | tr -d '\r ')

          if [ -z "$SIG" ]; then
            echo "$verify_out"
            echo "::error::未能从 apksigner 输出中解析出 SHA-256 指纹"
            exit 1
          fi

          echo "APK 签名: $SIG"

          if [ -z "$EXPECTED_SIGNATURE" ]; then
            echo "::warning::未配置 EXPECTED_SIGNATURE 变量，跳过指纹比对"
          elif [ "$SIG" != "$EXPECTED_SIGNATURE" ]; then
            echo "::error::APK 签名不符！"
            echo "::error::实际: $SIG"
            echo "::error::期望: $EXPECTED_SIGNATURE"
            exit 1
          else
            echo "✓ 签名与期望一致，可覆盖升级"
          fi

      - name: 重命名产物
        run: |
          VERSION="${{ needs.precheck.outputs.version }}"
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             "out/decaid-android11-${VERSION}-arm64.apk"
          sha256sum "out/decaid-android11-${VERSION}-arm64.apk" \
            | tee "out/decaid-android11-${VERSION}-arm64.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: android11-apk
          path: out/
          retention-days: 30

  # ===========================================================================
  # 阶段 3：发布（仅 tag 触发）
  # ===========================================================================
  # tag 带 android11- 前缀（android11-v0.9.3），与上游 v* 隔离：
  # fork 继承了上游 78 个稳定版 tag，同名会导致互相覆盖。
  # 资产名带 android11 标识，与官方 decaid-android-*.apk 区分。
  # ===========================================================================
  release:
    name: 发布 Release
    needs: [precheck, build]
    # 两种触发都要发布：
    #   tag push          → github.ref 是 refs/tags/*，用 ref_name
    #   workflow_dispatch → sync-upstream 调用，ref_name 是 android11，
    #                       真正的 tag 来自 inputs.tag
    # 原先只认 tag，导致 sync 自动触发的构建永远不发版。
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.tag != '' && !endsWith(inputs.tag, '-dryrun'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: android11-apk
          path: out

      - name: 解析发布用的 tag
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IN="${{ inputs.tag }}"
            case "$IN" in
              android11-*) TAG="$IN" ;;
              v*)          TAG="android11-$IN" ;;
              *)           TAG="android11-v$IN" ;;
            esac
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "发布标签: $TAG"

      - name: 确认 tag 已存在
        run: |
          git ls-remote --tags origin "refs/tags/${{ steps.rel.outputs.tag }}" \
            | grep -q . || {
              echo "::error::tag ${{ steps.rel.outputs.tag }} 不存在，拒绝发布"
              exit 1
            }

      - name: 生成 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: "${{ steps.rel.outputs.tag }} — Android 11 适配版"
          prerelease: false      # OTA 只认非 prerelease
          files: out/*
          body: |
            ## Android 11 适配版（${{ steps.rel.outputs.tag }}）

            > ⚠️ **非官方构建**，基于 [decentespresso/decaid](https://github.com/decentespresso/decaid)（GPL-3.0）
            > 仅解除 Android 12+ 的限制，其余功能与官方一致。

            ### 这个版本做了什么

            Decaid 官方要求 **Android 12 (SDK 31)** 及以上才在 App 内嵌显示界面，
            低于此版本的设备会显示「去浏览器打开」提示。本构建解除了这一限制：

            - `app.dart` — 不再因 `sdkInt < 31` 置降级标志
            - `app.dart` — 引导结束后正常打开皮肤，而非停在浏览器引导卡片
            - `webview_compatibility_checker.dart` — 跳过启动时的 WebView 自检

            已实测于 **Samsung Galaxy Tab S5e (SM-T727U, Android 11 / SDK 30)**。

            ### 安装

            ```bash
            adb install -r decaid-android11-${{ needs.precheck.outputs.version }}-arm64.apk
            ```

            签名与之前的 Android 11 适配版一致，可直接覆盖升级，**数据保留**。
            与**官方版签名不同**，从官方版切换需先卸载。

            ### 校验

            见 `*.sha256` 文件。

            ### 许可

            本项目遵循 GPL-3.0。源码：https://github.com/UncleIce/decaid-android11
