# =============================================================================
# 自动跟进上游新版本
# =============================================================================
#
# 仓库: https://github.com/UncleIce/decaid-android11
#
# 【工作流程】
#   每天定时检查 upstream 是否有新 tag
#        ↓ 有
#   验证补丁在新代码上仍能应用
#        ↓ 能
#   推送同名 tag 到本仓库 → 触发 android11-release.yml 构建发布
#        ↓ 不能
#   创建 Issue 告警，等人工适配
#
# 【为什么推送同名 tag】
#   用户要求 tag 与上游一致（v0.9.3）。fork 的 tag 命名空间独立，
#   因此可以直接创建与上游同名的 tag 而不冲突。
#
# 【为什么先验证补丁】
#   若补丁在新版本上失效，直接推 tag 会构建失败并发布残缺 release。
#   先跑 DRY_RUN 验证，能应用才推 tag。
# =============================================================================

name: Sync Upstream

on:
  schedule:
    # 每天 UTC 02:00 = 北京时间 10:00
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只检查，不推送 tag'
        type: boolean
        default: false
      force_version:
        description: '强制同步指定 tag（留空则自动检测最新）'
        required: false

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  UPSTREAM: decentespresso/decaid

jobs:
  sync:
    name: 检查并同步上游
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # 直接检出 build 分支：后续要基于它应用补丁并打 tag 触发构建
          ref: android11

      - name: 配置 git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # -----------------------------------------------------------------------
      # 检测上游最新稳定 tag
      # -----------------------------------------------------------------------
      # 关键：fork 会继承上游所有 tag，名字和我们发的一样（都是 v0.9.x）。
      # 所以「origin 上存在 v0.9.2」不代表我们已经发布过 —— 那可能是上游的。
      #
      # 正确的判断依据：tag 指向的提交里有没有 patch-android11.sh。
      #   · 有  → 这是我们打过补丁后发布的
      #   · 没有 → 这是 fork 继承来的上游 tag，尚未发布
      # -----------------------------------------------------------------------
      - name: 检测上游新版本
        id: check
        run: |
          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null || true

          # ★ 不要用 --force 拉 tag。
          # 我们用与上游相同的 tag 名（v0.9.2），--force 会把已发布的
          # 同名 tag 强制指回上游提交，冲掉我们自己打的 tag，
          # 结果每次运行都判定「未发布」，无限重复构建。
          # 不加 --force 时，已存在的 tag 保持不动，新 tag 正常拉取。
          git fetch upstream --tags --quiet
          git fetch origin --tags --force --quiet 2>/dev/null || true

          # 上游最新稳定 tag（排除 beta/alpha/rc）
          LATEST=$(git tag -l 'v*' --sort=-v:refname | grep -vE 'beta|alpha|rc' | head -1)

          if [ -n "${{ inputs.force_version }}" ]; then
            LATEST="${{ inputs.force_version }}"
            echo "手动指定版本: $LATEST"
          fi

          if [ -z "$LATEST" ]; then
            echo "::error::未找到上游 tag"
            exit 1
          fi

          # 该 tag 指向的提交里是否含我们的补丁脚本
          # = 是否为我们发布过的版本
          ALREADY=0
          if git cat-file -e "$LATEST:patch-android11.sh" 2>/dev/null; then
            ALREADY=1
          fi

          echo "目标版本: $LATEST"
          if [ "$ALREADY" = "1" ]; then
            echo "状态: 该版本已由本仓库发布（tag 指向含 patch-android11.sh 的提交）"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "状态: 尚未发布，需要构建"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
      # -----------------------------------------------------------------------
      # 补丁兼容性验证 —— 失败则不推 tag，避免产出坏包
      # -----------------------------------------------------------------------
      # 注意：验证要在「保留我们的脚本和 CI」的前提下进行。
      # 直接用 upstream/$LATEST 会丢掉 patch-android11.sh，
      # 所以这里用 merge-tree 把上游内容叠到 android11 的配置上。
      # -----------------------------------------------------------------------
      - name: 验证补丁可应用
        if: steps.check.outputs.new == 'true'
        id: verify
        run: |
          LATEST="${{ steps.check.outputs.latest }}"

          # 以 android11 为基（保留脚本/CI），把源码切到上游该版本
          git checkout -B verify-patch android11

          # 只把上游的 lib/ 和 pubspec/android 配置覆盖过来，保留我们的 .github 与脚本
          git checkout "upstream/$LATEST" -- lib pubspec.yaml android 2>/dev/null \
            || git checkout "$LATEST" -- lib pubspec.yaml android 2>/dev/null \
            || true

          test -f patch-android11.sh || { echo "::error::patch-android11.sh 不在分支上"; exit 1; }
          chmod +x patch-android11.sh

          if DRY_RUN=1 ./patch-android11.sh . ; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "✓ 补丁可应用于 $LATEST"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "✗ 补丁无法应用，需人工适配"
          fi

      # -----------------------------------------------------------------------
      # 应用补丁并提交到 android11 分支
      # -----------------------------------------------------------------------
      - name: 应用补丁并提交
        if: steps.check.outputs.new == 'true' && steps.verify.outputs.ok == 'true'
        run: |
          LATEST="${{ steps.check.outputs.latest }}"

          # verify-patch 已经包含：上游源码 + 我们的脚本/CI
          git checkout -B android11 verify-patch
          git branch -D verify-patch 2>/dev/null || true

          ./patch-android11.sh .

          # 清理备份文件，不提交
          find lib -name '*.orig' -delete 2>/dev/null || true

          git add -A
          if git diff --cached --quiet; then
            echo "无改动，仅推进版本"
          else
            git commit -m "chore(android11): 适配 $LATEST"
          fi
          git push origin android11 --force
            echo "✓ 已推送到 android11 分支"
          fi

      # -----------------------------------------------------------------------
      # 推送同名 tag 触发构建
      # -----------------------------------------------------------------------
      # 用户要求 tag 与上游一致。fork 的 tag 空间独立，可直接创建同名 tag。
      # 若本仓库已存在该 tag（重跑场景），先删除再重建。
      # -----------------------------------------------------------------------
      - name: 触发构建
        if: |
          steps.check.outputs.new == 'true' &&
          steps.verify.outputs.ok == 'true' &&
          inputs.dry_run != true
        run: |
          LATEST="${{ steps.check.outputs.latest }}"

          # 删除本地同名 tag（若有）
          git tag -d "$LATEST" 2>/dev/null || true

          # 删除远端同名 tag（若有，用于重跑）
          git ls-remote --tags origin "refs/tags/$LATEST" 2>/dev/null \
            | grep -q . && git push origin ":refs/tags/$LATEST" || true

          # 在 android11 分支的补丁提交上打 tag
          git checkout android11
          git tag -a "$LATEST" -m "Android 11 适配版 $LATEST"
          git push origin "$LATEST"

          echo "✓ 已推送 tag $LATEST，构建将自动开始"

      # -----------------------------------------------------------------------
      # 补丁失效时创建 Issue 告警
      # -----------------------------------------------------------------------
      - name: 补丁失效告警
        if: steps.check.outputs.new == 'true' && steps.verify.outputs.ok != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const latest = '${{ steps.check.outputs.latest }}';
            const title = `补丁失效：上游 ${latest} 需要人工适配`;

            // 避免重复开 issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'patch-broken'
            });
            if (issues.some(i => i.title === title)) {
              console.log('已有相同 issue，跳过');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['patch-broken'],
              body: `上游发布了 **${latest}**，但 \`patch-android11.sh\` 无法应用于新代码。

              ## 需要做什么

              1. 本地检出该版本：
                 \`\`\`bash
                 git fetch upstream --tags
                 git checkout -b fix-${latest} upstream/${latest}
                 \`\`\`

              2. 运行补丁看哪一处失败：
                 \`\`\`bash
                 DRY_RUN=1 ./patch-android11.sh .
                 \`\`\`

              3. 定位新的代码位置：
                 \`\`\`bash
                 grep -n 'sdkInt' lib/src/app.dart
                 grep -n 'degradedAndroid' lib/src/app.dart
                 \`\`\`

              4. 修改 \`patch-android11.sh\` 中对应的 old/new 字符串

              5. 验证通过后推送：
                 \`\`\`bash
                 ./patch-android11.sh .
                 git add -A && git commit -m "fix: 适配 ${latest}"
                 git push origin fix-${latest}
                 \`\`\`

              6. 手动触发 Sync Upstream workflow 完成发布

              ## 可能的情况

              如果上游已经把版本门槛从 \`sdkInt < 31\` 改成 \`< 29\`，
              说明**官方已支持 Android 11**，本项目可以退休了。`
            });

      - name: 汇总
        run: |
          echo "### 同步结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 目标版本 | \`${{ steps.check.outputs.latest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 需要构建 | ${{ steps.check.outputs.new }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 补丁兼容 | ${{ steps.verify.outputs.ok }} |" >> $GITHUB_STEP_SUMMARY
